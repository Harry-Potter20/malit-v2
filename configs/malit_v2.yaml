model:
  name: malit_v2
  num_classes: 2
  image_size: 224
  gabor:
    n_orientations: 8
    n_scales: 4
    kernel_size: 15
    out_channels: 3
  efficientnet:
    backbone: efficientnet_b0
    pretrained: true
    freeze_blocks: 4
  lcci:
    reduction: 16
  attention:
    channel_reduction: 16
  multiscale:
    receptive_fields: [1, 3, 5, 7]

training:
  seeds:
    tier1: [42, 123, 456]
    tier2: [42, 123]
    tier3: [42]
  active_tier: 1
  optimizer:
    name: adamw
    lr: 3.0e-4
    weight_decay: 1.0e-4
  scheduler:
    name: cosine_annealing
    T_max: 20
    eta_min: 1.0e-6
  epochs: 20
  lambda_cal: 0.1
  cal_warmup_epochs: 3
  batch_size: 32
  amp: true
  early_stopping:
    patience: 3
    monitor: val_f1
  grad_clip: 1.0
  num_workers: 4

data:
  dataset: cell-images-for-detecting-malaria
  splits:
    train: 0.70
    val: 0.15
    test: 0.15
  seed: 42
  deduplication:
    hash_size: 16
    hamming_threshold: 4
  augmentation:
    train:
      horizontal_flip: true
      vertical_flip: true
      rotation: 15
      color_jitter: 0.2
    val:
      normalize_only: true

statistics:
  mcnemar:
    per_seed: true
    aggregate: true
  tost:
    margin: 0.005
    alpha: 0.05

paths:
  data: data/
  results:
    models: results/models/
    plots: results/plots/
    gradcam: results/gradcam/
    attention: results/attention_maps/
    statistics: results/statistics/
    tables: results/tables/
    reproducibility: results/reproducibility/

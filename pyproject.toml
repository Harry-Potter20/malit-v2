[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "malit-v2"
version = "2.0.0"
description = "MALIT V2 Research Orchestration Pipeline for Malaria Cell Image Classification"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "timm>=0.9.0",
    "scikit-learn>=1.3.0",
    "imagehash>=4.3.1",
    "seaborn>=0.13.0",
    "matplotlib>=3.8.0",
    "kaggle>=1.6.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
    "Pillow>=10.0.0",
    "scipy>=1.11.0",
    "statsmodels>=0.14.0",
    "grad-cam>=1.4.8",
    "tqdm>=4.66.0",
    "pyyaml>=6.0.1",
    "tensorboard>=2.14.0",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = ["pytest", "black", "ruff", "mypy"]

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
